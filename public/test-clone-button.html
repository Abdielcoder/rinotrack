<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Botón Clonar</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .btn-action {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s ease;
            margin: 0 2px;
        }

        .btn-view {
            background: #dbeafe;
            color: #2563eb;
        }

        .btn-edit {
            background: #f3f4f6;
            color: #6b7280;
        }

        .btn-clone {
            background: #f3f4f6;
            color: #6b7280;
        }

        .btn-clone:hover {
            background: #e5e7eb;
            color: #374151;
            transform: translateY(-1px);
        }

        .action-buttons {
            display: flex;
            gap: 4px;
            justify-content: center;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #e5e7eb;
        }

        th {
            background: #f9fafb;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <h1>Test del Botón de Clonar</h1>
    
    <table>
        <thead>
            <tr>
                <th>Tarea</th>
                <th>Proyecto</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Tarea de Prueba 1</td>
                <td>Proyecto A</td>
                <td>
                    <div class="action-buttons">
                        <a href="#" class="btn-action btn-view" title="Ver detalles">
                            <i class="fas fa-eye"></i>
                        </a>
                        <a href="#" class="btn-action btn-edit" title="Editar tarea">
                            <i class="fas fa-edit"></i>
                        </a>
                        <button class="btn-action btn-clone" onclick="testClone(1)" title="Clonar tarea">
                            <i class="fas fa-copy"></i>
                        </button>
                    </div>
                </td>
            </tr>
            <tr>
                <td>Tarea de Prueba 2</td>
                <td>Proyecto B</td>
                <td>
                    <div class="action-buttons">
                        <a href="#" class="btn-action btn-view" title="Ver detalles">
                            <i class="fas fa-eye"></i>
                        </a>
                        <a href="#" class="btn-action btn-edit" title="Editar tarea">
                            <i class="fas fa-edit"></i>
                        </a>
                        <button class="btn-action btn-clone" onclick="testClone(2)" title="Clonar tarea">
                            <i class="fas fa-copy"></i>
                        </button>
                    </div>
                </td>
            </tr>
        </tbody>
    </table>

    <script>
        function testClone(taskId) {
            alert('Botón de clonar funcionando para tarea ID: ' + taskId);
        }
    </script>
</body>
</html>
