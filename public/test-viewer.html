<!DOCTYPE html>
<html>
<head>
    <title>Test File Viewer</title>
    <style>
        body { font-family: Arial; padding: 20px; }
        .test-section { margin: 20px 0; padding: 20px; border: 1px solid #ccc; }
        img { max-width: 100%; border: 2px solid #333; }
    </style>
</head>
<body>
    <h1>🧪 Test File Viewer</h1>
    
    <div class="test-section">
        <h2>Test 1: Cargar imagen con attachment_id=96</h2>
        <img src="file-viewer.php?id=96" alt="Test Image" 
             onload="document.getElementById('status1').innerHTML = '✅ Imagen cargada exitosamente'"
             onerror="document.getElementById('status1').innerHTML = '❌ Error al cargar imagen'">
        <p id="status1">⏳ Cargando...</p>
    </div>
    
    <div class="test-section">
        <h2>Test 2: Info del archivo (JSON)</h2>
        <button onclick="testInfo()">Obtener Info</button>
        <pre id="info-result"></pre>
    </div>
    
    <div class="test-section">
        <h2>Test 3: Cargar con URL directa</h2>
        <a href="file-viewer.php?id=96" target="_blank">Abrir file-viewer.php?id=96</a>
    </div>
    
    <script>
        async function testInfo() {
            try {
                const response = await fetch('file-viewer.php?id=96&action=info');
                const data = await response.json();
                document.getElementById('info-result').textContent = JSON.stringify(data, null, 2);
            } catch (error) {
                document.getElementById('info-result').textContent = 'Error: ' + error.message;
            }
        }
        
        console.log('🧪 Test page loaded');
    </script>
</body>
</html>
